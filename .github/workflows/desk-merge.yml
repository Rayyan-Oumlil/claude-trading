name: desk-merge

# Merges a trading-desk claude/* branch into master when every changed path is
# desk output (routines_pkg/desk_merge_guard.py). Triggered via workflow_run so
# the YAML and the guard come from master, never from the branch under review.
# GITHUB_TOKEN pushes don't trigger desk-notify, so alerts are forwarded here.

on:
  workflow_run:
    workflows: [desk-branch-pushed]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: desk-merge
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
    steps:
      - name: Checkout master (trusted code only)
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Guard changed paths
        id: guard
        shell: bash
        run: |
          case "$BRANCH" in claude/*) ;; *) echo "not a claude/* branch: $BRANCH"; exit 1 ;; esac
          if ! git fetch origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"; then
            echo "branch already merged or deleted"; echo "merge=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git diff --no-renames --name-only "origin/master...origin/$BRANCH" > "$RUNNER_TEMP/changed.txt"
          cat "$RUNNER_TEMP/changed.txt"
          if ! python -m routines_pkg.desk_merge_guard < "$RUNNER_TEMP/changed.txt" > "$RUNNER_TEMP/blocked.txt"; then
            python -m paper_trading.notify "🟠 $BRANCH not auto-merged — needs your review: $(tr '\n' ' ' < "$RUNNER_TEMP/blocked.txt")"
            echo "merge=no" >> "$GITHUB_OUTPUT"
          else
            echo "merge=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge into master
        if: steps.guard.outputs.merge == 'yes'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git merge --no-edit "origin/$BRANCH"; then
            python -m paper_trading.notify "🔴 $BRANCH conflicts with master — desk output not merged."
            exit 1
          fi
          for i in 1 2 3; do
            if git push origin master; then break; fi
            git pull --no-edit origin master
          done

      - name: Forward desk alert
        if: steps.guard.outputs.merge == 'yes'
        shell: bash
        run: |
          if grep -qx "memory/desk-alert.txt" "$RUNNER_TEMP/changed.txt"; then
            python -m paper_trading.notify "$(cat memory/desk-alert.txt)"
          fi

      - name: Delete merged branch
        if: steps.guard.outputs.merge == 'yes'
        run: git push origin --delete "$BRANCH"
