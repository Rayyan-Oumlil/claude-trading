name: daily-trade

# GitHub Actions cron is UTC and best-effort (observed 3-5 h late). It is the
# FALLBACK: the on-time trigger is a Windows scheduled task (routines/README.md).
#   premarket  -> 11:00 UTC weekdays
#   eod        -> 00:20 UTC every day: after the 00:00 UTC crypto close; SPY's
#                 session closed hours earlier, so SPY orders queue for the next open.
#
# Manual `workflow_dispatch` lets us trigger any mode from the Actions tab.
on:
  schedule:
    - cron: '0 11 * * 1-5'    # premarket
    - cron: '20 0 * * *'      # eod (daily; crypto trades 7 days)
  workflow_dispatch:
    inputs:
      mode:
        description: 'premarket | eod'
        required: true
        default: 'eod'
        type: choice
        options:
          - premarket
          - eod

permissions:
  contents: write   # required so the run can commit memory/journal updates back

concurrency:
  group: daily-trade
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
      ALPACA_PAPER_TRADE: ${{ secrets.ALPACA_PAPER_TRADE }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A queued run checks out the commit from when it was triggered. If an earlier run
      # pushed log lines meanwhile, trading on the stale log would lose them at push time.
      - name: Sync to latest master
        run: git pull --ff-only origin master

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests (no trading on a red suite)
        run: python -m pytest -q

      - name: Determine mode
        id: mode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 11 * * 1-5" ]; then
            echo "mode=premarket" >> "$GITHUB_OUTPUT"
          else
            echo "mode=eod" >> "$GITHUB_OUTPUT"
          fi
          echo "Selected mode: $(cat "$GITHUB_OUTPUT" | grep mode=)"

      - name: Verify required secrets and paper-mode flag
        shell: bash
        run: |
          if [ -z "$ALPACA_API_KEY" ] || [ -z "$ALPACA_API_SECRET" ]; then
            echo "::error ::ALPACA_API_KEY / ALPACA_API_SECRET are not set as repo secrets."
            exit 1
          fi
          # Paper-mode safety gate. The Python client constructor hardcodes paper=True,
          # but this check guarantees no one flips the flag silently via repo secrets.
          if [ "$ALPACA_PAPER_TRADE" != "true" ]; then
            echo "::error ::ALPACA_PAPER_TRADE must be 'true' (got: '${ALPACA_PAPER_TRADE:-<unset>}'). Live trading is not authorized from this workflow."
            exit 1
          fi
          echo "Paper mode confirmed: ALPACA_PAPER_TRADE=true"

      - name: Run premarket routine
        if: steps.mode.outputs.mode == 'premarket'
        run: python -m routines_pkg.premarket

      - name: Mark confidence-log length
        id: logmark
        if: steps.mode.outputs.mode == 'eod'
        shell: bash
        run: echo "lines=$(wc -l < memory/confidence-log.md)" >> "$GITHUB_OUTPUT"

      - name: Run signal then EOD routine
        if: steps.mode.outputs.mode == 'eod'
        run: |
          set -e
          python run_signal.py
          python -m routines_pkg.eod_close

      - name: Build desk snapshot
        id: snapshot
        if: always() && steps.mode.outputs.mode == 'eod'
        run: python -m routines_pkg.desk_snapshot --report > "$RUNNER_TEMP/daily-report.txt"

      # Unacknowledged "halt" flags write .HALT (robot stops next run) and text Rayyan.
      - name: Auto-halt (deterministic brake)
        if: always() && steps.mode.outputs.mode == 'eod' && steps.snapshot.outcome == 'success'
        run: python -m routines_pkg.auto_halt

      - name: Send daily P&L report
        if: always() && steps.mode.outputs.mode == 'eod'
        shell: bash
        run: |
          if [ -s "$RUNNER_TEMP/daily-report.txt" ]; then
            python -m paper_trading.notify "$(cat "$RUNNER_TEMP/daily-report.txt")"
          else
            python -m paper_trading.notify "📉 daily P&L report unavailable — desk snapshot failed (see run ${{ github.run_id }})"
          fi

      - name: Commit memory + journal updates
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add memory journal
          if [ -f .HALT ]; then git add -f .HALT; fi
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "routine: ${{ steps.mode.outputs.mode }} $(date -u +%Y-%m-%dT%H:%MZ)"
            # Push with retry to handle the rare race with another routine.
            for i in 1 2 3; do
              if git push; then
                exit 0
              fi
              git pull --rebase --autostash
            done
            git push
          fi

      - name: Alert on trade or halt
        if: always() && steps.mode.outputs.mode == 'eod' && steps.logmark.outputs.lines != ''
        shell: bash
        run: |
          new="$(tail -n +$(( ${{ steps.logmark.outputs.lines }} + 1 )) memory/confidence-log.md | grep -E '\| (BUY|SELL|HALT|PENDING) \|' || true)"
          if [ -n "$new" ]; then
            python -m paper_trading.notify "daily-trade eod:
          $new"
          fi

      - name: Alert on failure
        if: failure()
        run: python -m paper_trading.notify "daily-trade ${{ steps.mode.outputs.mode }} FAILED - ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Surface confidence-log tail (self-test)
        if: always()
        shell: bash
        run: |
          echo "::group::confidence-log tail"
          tail -n 5 memory/confidence-log.md || true
          echo "::endgroup::"
